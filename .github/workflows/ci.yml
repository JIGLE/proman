name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run Playwright E2E after build (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ── Shared lint/type-check/test trio — see reusable-verify.yml ──
  verify:
    uses: ./.github/workflows/reusable-verify.yml
    permissions:
      contents: read

  # ── Build waits for the shared verify jobs to pass ──
  build:
    name: Build validation
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci || (npm install --package-lock-only --ignore-scripts && npm ci)

      - name: Build (Next.js)
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: file:./ci-build.db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-test-secret-minimum-32-characters
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder
          # `NEXT_PUBLIC_*` is inlined at build time, so this has to be set here rather than on
          # the jobs that consume the artifact. Without it the sign-in page ships no credentials
          # form in a production build and the audit harness cannot authenticate — which is what
          # it hit the first time it actually reached the browser.
          #
          # This only reveals the form. The credentials provider itself is gated separately on
          # the server by ENABLE_DEMO_LOGIN, set per-job below, so a build that leaked out of CI
          # still has no working demo login unless the runtime flag is also set.
          NEXT_PUBLIC_ENABLE_DEMO_LOGIN: "true"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-build
          path: .next/
          include-hidden-files: true
          retention-days: 1

  smoke:
    name: Smoke test (start built app)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts || (npm install --package-lock-only --ignore-scripts && npm ci --ignore-scripts)

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: nextjs-build
          path: .next/

      - name: Start built app
        run: |
          # Copy static assets and public into standalone (mirrors Dockerfile)
          cp -r .next/static .next/standalone/.next/static 2>/dev/null || true
          cp -r public .next/standalone/public 2>/dev/null || true
          nohup node .next/standalone/server.js > app.log 2>&1 &
          echo $! > .app.pid
        env:
          # Absolute: standalone `server.js` chdirs to its own directory, so a relative path
          # would land in `.next/standalone/`. See the Mobile Audit job for the full account.
          DATABASE_URL: file:${{ github.workspace }}/ci-smoke.db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-test-secret-minimum-32-characters
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder
          NODE_ENV: production
          PORT: 3000
          HOSTNAME: 0.0.0.0

      - name: Wait for app
        run: npx wait-on http://localhost:3000 --timeout 120000

      - name: Smoke check
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000)
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 400 ]; then
            echo "::error::App returned HTTP $HTTP_STATUS"
            cat app.log
            exit 1
          fi

      - name: Health check
        run: |
          curl -fS http://localhost:3000/api/ready || (cat app.log && exit 1)

  e2e-smoke:
    name: E2E Smoke (required on PR)
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 20
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci || (npm install --package-lock-only --ignore-scripts && npm ci)

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: nextjs-build
          path: .next/

      # This job never created a schema either, so every DB-backed route answered 500 and the
      # suite stayed green regardless — the same false-green the mobile audit was in. Create the
      # tables so the smoke run exercises the app rather than its error paths.
      - name: Create database schema
        run: npx prisma db push
        env:
          DATABASE_URL: file:${{ github.workspace }}/e2e-smoke.db

      - name: Start built application in background
        run: |
          cp -r .next/static .next/standalone/.next/static 2>/dev/null || true
          cp -r public .next/standalone/public 2>/dev/null || true
          nohup node .next/standalone/server.js > app.log 2>&1 &
          echo $! > .app.pid
        env:
          DATABASE_URL: file:${{ github.workspace }}/e2e-smoke.db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: e2e-test-secret-minimum-32-characters
          GOOGLE_CLIENT_ID: e2e-placeholder
          GOOGLE_CLIENT_SECRET: e2e-placeholder
          # Needed even though every test in smoke.spec.ts is unauthenticated: both Playwright
          # projects declare `dependencies: ["setup"]`, so `auth.setup.ts` runs here too, and it
          # now fails loudly instead of silently writing an empty session. No ALLOW_DEMO_MODE and
          # no E2E_SEED — this job must keep a signed-out `request` fixture, because one of its
          # tests asserts that unauthenticated API calls never return data.
          ENABLE_DEMO_LOGIN: "true"
          NODE_ENV: production
          PORT: 3000
          HOSTNAME: 0.0.0.0

      - name: Wait for app to become healthy
        run: npx wait-on http://localhost:3000 --timeout 120000

      - name: Run Playwright smoke tests
        run: npx playwright test e2e/smoke.spec.ts --project=chromium
        env:
          DATABASE_URL: file:${{ github.workspace }}/e2e-smoke.db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: e2e-test-secret-minimum-32-characters

      - name: Upload Playwright smoke report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 7

      - name: Dump app log on failure
        if: failure()
        run: cat app.log 2>/dev/null || echo 'No app log found'

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 45
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true') ||
      (github.event_name == 'pull_request' && contains(join(github.event.pull_request.labels.*.name, ','), 'run-e2e'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci || (npm install --package-lock-only --ignore-scripts && npm ci)

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: nextjs-build
          path: .next/

      # See the E2E Smoke job: no schema meant every DB-backed route 500'd and the suite passed
      # anyway. Combined with the `if (await link.isVisible())` guards throughout these specs,
      # that is two independent reasons this job could go green without testing anything.
      - name: Create database schema
        run: npx prisma db push
        env:
          DATABASE_URL: file:${{ github.workspace }}/e2e-test.db

      - name: Start built application in background
        run: |
          cp -r .next/static .next/standalone/.next/static 2>/dev/null || true
          cp -r public .next/standalone/public 2>/dev/null || true
          nohup node .next/standalone/server.js > app.log 2>&1 &
          echo $! > .app.pid
        env:
          DATABASE_URL: file:${{ github.workspace }}/e2e-test.db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: e2e-test-secret-minimum-32-characters
          GOOGLE_CLIENT_ID: e2e-placeholder
          GOOGLE_CLIENT_SECRET: e2e-placeholder
          # Without these, `auth.setup.ts` cannot sign in and every spec that declares
          # `test.use({ storageState })` runs signed out — which is what it silently did until
          # now. ALLOW_DEMO_MODE additionally opens /api/debug/db/seed so the suite has records
          # to act on; the delete-confirmation specs skip themselves against an empty database.
          ALLOW_DEMO_MODE: "true"
          ENABLE_DEMO_LOGIN: "true"
          NODE_ENV: production
          PORT: 3000
          HOSTNAME: 0.0.0.0

      - name: Wait for app to become healthy
        run: npx wait-on http://localhost:3000 --timeout 120000

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          DATABASE_URL: file:${{ github.workspace }}/e2e-test.db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: e2e-test-secret-minimum-32-characters
          # Opt in to seeding. `seedDemoData` deletes and recreates the demo user's records, so
          # `auth.setup.ts` only runs it when asked — never against a developer's dev.db.
          E2E_SEED: "true"

      # The mobile-chrome project (Pixel 5) has been defined in playwright.config.ts since it
      # was added but has never run — both jobs hardcoded --project=chromium. Non-blocking for
      # now: this is its first execution anywhere, so the run is a measurement, not a gate.
      # Promote it by deleting continue-on-error once a few runs have come back green.
      - name: Run Playwright tests (mobile viewport)
        run: npx playwright test --project=mobile-chrome
        continue-on-error: true
        env:
          DATABASE_URL: file:${{ github.workspace }}/e2e-test.db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: e2e-test-secret-minimum-32-characters
          # Re-seed rather than inherit the chromium step's state. The seed is idempotent, and
          # this step should not silently depend on the one above having run first.
          E2E_SEED: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Dump app log on failure
        if: failure()
        run: cat app.log 2>/dev/null || echo 'No app log found'

  mobile-audit:
    name: Mobile Audit (390px responsive violations)
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 30
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci || (npm install --package-lock-only --ignore-scripts && npm ci)

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: nextjs-build
          path: .next/

      # Nothing in this workflow had ever created a schema, so `mobile-audit.db` was an empty
      # SQLite file with no tables. `--seed` then failed silently, `resolveIds` returned nulls,
      # and all ten detail-overlay surfaces skipped — which is why the first completed CI run
      # reported 42 surface-runs of empty screens instead of 52 of real ones.
      #
      # The path must be ABSOLUTE. Next.js's standalone `server.js` starts with
      # `process.chdir(__dirname)`, so a relative `file:./x.db` resolves to
      # `.next/standalone/x.db` for the server while `prisma db push` (run from the repo root)
      # writes to `<root>/x.db` — two different files. Adding the schema step above was
      # necessary but not sufficient for exactly this reason: the server kept looking in
      # `.next/standalone/` and reported "SQLite DB file does not exist", the seed 500'd, and
      # every detail overlay skipped. This is easy to miss locally, where a stale `.db` at the
      # repo root gets traced into `.next/standalone/` by `next build` and the run works by
      # accident; in CI the build happens in a separate job before the file exists.
      - name: Create database schema
        run: npx prisma db push
        env:
          DATABASE_URL: file:${{ github.workspace }}/mobile-audit.db

      - name: Start built application in background
        run: |
          cp -r .next/static .next/standalone/.next/static 2>/dev/null || true
          cp -r public .next/standalone/public 2>/dev/null || true
          nohup node .next/standalone/server.js > app.log 2>&1 &
          echo $! > .app.pid
        env:
          DATABASE_URL: file:${{ github.workspace }}/mobile-audit.db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: mobile-audit-secret-minimum-32-characters
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder
          ALLOW_DEMO_MODE: "true"
          ENABLE_DEMO_LOGIN: "true"
          NODE_ENV: production
          PORT: 3000
          HOSTNAME: 0.0.0.0

      - name: Wait for app to become healthy
        run: npx wait-on http://localhost:3000 --timeout 120000

      # `--seed` is not optional: without it the harness walks a bare database, and a table with
      # no rows cannot overflow. Every number this job produced before it was added described
      # empty screens. `--strict` ratchets against BASELINE in the harness.
      #
      # This is a real gate now. CI reported `✓ Mobile audit exactly at baseline` on a seeded
      # 52-surface run — pageOverflow 0, touchTargetFails 4, touchTargetWarns 4,
      # clippedContainers 6, smallText 310 — matching three consecutive local runs against a
      # production standalone build and a fresh database. `continue-on-error` was the only
      # thing keeping an unmeasured baseline from blocking a PR, and the baseline is now
      # measured, so it comes off.
      #
      # If this fails: read the numbers before touching BASELINE. It may only ever go down.
      - name: Run mobile audit harness
        run: node scripts/mobile-audit.mjs --seed --strict
        env:
          AUDIT_BASE_URL: http://localhost:3000
          CI: "true"

      - name: Parse and report audit violations
        if: always()
        run: |
          set -euo pipefail
          REPORT=audit-report/report-390.json

          # A harness that crashed is not the same as a harness that found violations. Both now
          # fail the job, but they are different failures and the summary must say which: a
          # regression is a design backlog item, a harness that never started is a broken gate.
          # This step runs with `if: always()` so it still reports when the harness exits
          # non-zero. It used to exit 0 on a missing report, which is how the job stayed green
          # while the harness died at browser launch on every run.
          if [ ! -f "$REPORT" ]; then
            echo "## ❌ Mobile audit did not run" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The harness exited before writing \`$REPORT\`. This is a broken gate, not a" >> $GITHUB_STEP_SUMMARY
            echo "responsive-design regression — check the harness logs above." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # Read the harness's own pre-aggregated `summary` object. The previous version of this
          # step reduced over a `.surfaces[]` array that has never existed on this report (the
          # root keys are meta/summary/results), so every query yielded nothing and `|| echo 0`
          # turned that into a clean bill of health. `-e` makes a missing key fail the step
          # instead of silently printing a zero.
          jq -e '.summary' "$REPORT" > /dev/null

          SEEDED=$(jq -r '.meta.seeded' "$REPORT")
          read -r RUNS FAILED OVERFLOW TFAIL TWARN CLIPPED SMALLTEXT < <(
            jq -r '.summary | "\(.surfaceRuns) \(.failedToLoad) \(.pageOverflow) \(.touchTargetFails) \(.touchTargetWarns) \(.clippedContainers) \(.smallText)"' "$REPORT"
          )

          {
            echo "## 📱 Mobile Audit Report (390×844)"
            echo ""
            echo "Scanned **$RUNS surface-runs** (each surface in both themes) · seeded: \`$SEEDED\`"
            [ "$SEEDED" = "true" ] || echo ""
            [ "$SEEDED" = "true" ] || echo "> ⚠️ Unseeded run — these counts describe empty screens and mean little."
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| Surfaces failing to load | $FAILED |"
            echo "| **Surface-runs with page-level horizontal overflow** | **$OVERFLOW** |"
            echo "| Touch targets under 24px (WCAG 2.2 AA fail) | $TFAIL |"
            echo "| Touch targets under 44px | $TWARN |"
            echo "| Containers clipping content (unreachable) | $CLIPPED |"
            echo "| Text under 12px | $SMALLTEXT |"
            echo ""
            echo "See \`audit-report/report-390.md\` in the artifact for the per-surface breakdown."
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload mobile audit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-audit-report
          path: audit-report/
          retention-days: 7

      - name: Dump app log on failure
        if: failure()
        run: cat app.log 2>/dev/null || echo 'No app log found'
