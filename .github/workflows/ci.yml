name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run Playwright E2E after build (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ── Shared lint/type-check/test trio — see reusable-verify.yml ──
  verify:
    uses: ./.github/workflows/reusable-verify.yml
    permissions:
      contents: read

  # ── Build waits for the shared verify jobs to pass ──
  build:
    name: Build validation
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci || (npm install --package-lock-only --ignore-scripts && npm ci)

      - name: Build (Next.js)
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: file:./ci-build.db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-test-secret-minimum-32-characters
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-build
          path: .next/
          include-hidden-files: true
          retention-days: 1

  smoke:
    name: Smoke test (start built app)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts || (npm install --package-lock-only --ignore-scripts && npm ci --ignore-scripts)

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: nextjs-build
          path: .next/

      - name: Start built app
        run: |
          # Copy static assets and public into standalone (mirrors Dockerfile)
          cp -r .next/static .next/standalone/.next/static 2>/dev/null || true
          cp -r public .next/standalone/public 2>/dev/null || true
          nohup node .next/standalone/server.js > app.log 2>&1 &
          echo $! > .app.pid
        env:
          DATABASE_URL: file:./ci-smoke.db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-test-secret-minimum-32-characters
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder
          NODE_ENV: production
          PORT: 3000
          HOSTNAME: 0.0.0.0

      - name: Wait for app
        run: npx wait-on http://localhost:3000 --timeout 120000

      - name: Smoke check
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000)
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 400 ]; then
            echo "::error::App returned HTTP $HTTP_STATUS"
            cat app.log
            exit 1
          fi

      - name: Health check
        run: |
          curl -fS http://localhost:3000/api/ready || (cat app.log && exit 1)

  e2e-smoke:
    name: E2E Smoke (required on PR)
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 20
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci || (npm install --package-lock-only --ignore-scripts && npm ci)

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: nextjs-build
          path: .next/

      - name: Start built application in background
        run: |
          cp -r .next/static .next/standalone/.next/static 2>/dev/null || true
          cp -r public .next/standalone/public 2>/dev/null || true
          nohup node .next/standalone/server.js > app.log 2>&1 &
          echo $! > .app.pid
        env:
          DATABASE_URL: file:./e2e-smoke.db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: e2e-test-secret-minimum-32-characters
          GOOGLE_CLIENT_ID: e2e-placeholder
          GOOGLE_CLIENT_SECRET: e2e-placeholder
          NODE_ENV: production
          PORT: 3000
          HOSTNAME: 0.0.0.0

      - name: Wait for app to become healthy
        run: npx wait-on http://localhost:3000 --timeout 120000

      - name: Run Playwright smoke tests
        run: npx playwright test e2e/smoke.spec.ts --project=chromium
        env:
          DATABASE_URL: file:./e2e-smoke.db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: e2e-test-secret-minimum-32-characters

      - name: Upload Playwright smoke report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 7

      - name: Dump app log on failure
        if: failure()
        run: cat app.log 2>/dev/null || echo 'No app log found'

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 45
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true') ||
      (github.event_name == 'pull_request' && contains(join(github.event.pull_request.labels.*.name, ','), 'run-e2e'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci || (npm install --package-lock-only --ignore-scripts && npm ci)

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: nextjs-build
          path: .next/

      - name: Start built application in background
        run: |
          cp -r .next/static .next/standalone/.next/static 2>/dev/null || true
          cp -r public .next/standalone/public 2>/dev/null || true
          nohup node .next/standalone/server.js > app.log 2>&1 &
          echo $! > .app.pid
        env:
          DATABASE_URL: file:./e2e-test.db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: e2e-test-secret-minimum-32-characters
          GOOGLE_CLIENT_ID: e2e-placeholder
          GOOGLE_CLIENT_SECRET: e2e-placeholder
          NODE_ENV: production
          PORT: 3000
          HOSTNAME: 0.0.0.0

      - name: Wait for app to become healthy
        run: npx wait-on http://localhost:3000 --timeout 120000

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          DATABASE_URL: file:./e2e-test.db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: e2e-test-secret-minimum-32-characters

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Dump app log on failure
        if: failure()
        run: cat app.log 2>/dev/null || echo 'No app log found'

  mobile-audit:
    name: Mobile Audit (390px responsive violations)
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 30
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci || (npm install --package-lock-only --ignore-scripts && npm ci)

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: nextjs-build
          path: .next/

      - name: Start built application in background
        run: |
          cp -r .next/static .next/standalone/.next/static 2>/dev/null || true
          cp -r public .next/standalone/public 2>/dev/null || true
          nohup node .next/standalone/server.js > app.log 2>&1 &
          echo $! > .app.pid
        env:
          DATABASE_URL: file:./mobile-audit.db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: mobile-audit-secret-minimum-32-characters
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder
          ALLOW_DEMO_MODE: "true"
          NODE_ENV: production
          PORT: 3000
          HOSTNAME: 0.0.0.0

      - name: Wait for app to become healthy
        run: npx wait-on http://localhost:3000 --timeout 120000

      - name: Run mobile audit harness
        run: node scripts/mobile-audit.mjs
        env:
          AUDIT_BASE_URL: http://localhost:3000
          CI: "true"
        continue-on-error: true

      - name: Parse and report audit violations
        if: always()
        run: |
          if [ -f audit-report/report-390.json ]; then
            echo "## 📱 Mobile Audit Report (390px)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Extract violation counts
            TOTAL_SURFACES=$(jq '.surfaces | length' audit-report/report-390.json || echo "0")
            OVERFLOW_VIOLATIONS=$(jq '[.surfaces[] | select(.horizontalOverflow.exceeded == true)] | length' audit-report/report-390.json || echo "0")
            TOUCH_TARGET_VIOLATIONS=$(jq '[.surfaces[] | select(.touchTargets.violations[0] != null)] | length' audit-report/report-390.json || echo "0")

            echo "Scanned **$TOTAL_SURFACES surfaces** at 390×844 (Pixel 5)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Surfaces with horizontal overflow | $OVERFLOW_VIOLATIONS |" >> $GITHUB_STEP_SUMMARY
            echo "| Surfaces with sub-44px touch targets | $TOUCH_TARGET_VIOLATIONS |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "See audit-report/report-390.md for details." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ Mobile Audit Failed" >> $GITHUB_STEP_SUMMARY
            echo "The audit harness did not complete. Check the logs above." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload mobile audit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-audit-report
          path: audit-report/
          retention-days: 7

      - name: Dump app log on failure
        if: failure()
        run: cat app.log 2>/dev/null || echo 'No app log found'
