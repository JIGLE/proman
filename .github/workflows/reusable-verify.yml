name: Verify (reusable)

# Shared lint/type-check/test trio, called by both ci.yml (PR gate) and
# production.yml (post-merge gate) so the two copies can't drift out of sync.
# Job names match the required-status-check names in .github/BRANCH_PROTECTION.md —
# do not rename lint-type/test's `name:` without updating that config + doc together.

on:
  workflow_call: {}

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  lint-type:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci || (npm install --package-lock-only --ignore-scripts && npm ci)

      - name: Run linter
        run: npm run lint

      - name: Format check
        run: npx prettier --check .

      - name: Type check
        run: npm run type-check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci || (npm install --package-lock-only --ignore-scripts && npm ci)

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore
